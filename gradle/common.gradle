// ------------------------------------------------------------------------------
// Version Range Calculations for NeoForge & Dependencies
// ------------------------------------------------------------------------------
ext.getMajorVersionRange = { version ->
	String v = version.toString()
	def prefix = v.contains('-') ? v.substring(0, v.indexOf('-') + 1) : ""
	def clean = prefix ? v.substring(prefix.length()) : v
	def major = clean.takeBefore('.') as int
	def next = prefix ? "${prefix}${major + 1}" : "${major + 1}"
	return "[${v},${next})".toString()
}

ext.getMinorVersionRange = { version ->
	String v = version.toString()
	def major = v.takeBefore('.')
	def minor = (v.takeAfter('.').takeBefore('.') ?: v.takeAfter('.')) as int
	return "[${v},${major}.${minor + 1})".toString()
}

ext.getPatchVersionRange = { version ->
	String v = version.toString()
	def lastDot = v.lastIndexOf('.')
	if (lastDot != -1) {
		def prefix = v.substring(0, lastDot + 1)
		def patch = (v.substring(lastDot + 1) as int) + 1
		return "[${v},${prefix}${patch})".toString()
	}
	return "[${v},)".toString()
}

ext.getMineraculousVersionRange = { version ->
	String v = version.toString()
	if (!v.contains('-beta'))
		return ext.getMajorVersionRange(v)
	def suffix = v.indexOf('beta') + 4 as int
	def base = v.substring(0, suffix)
	def beta = v.substring(suffix) as int
	return "[${v},${base}${beta + 1})".toString()
}

