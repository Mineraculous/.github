		"${mod_id}" {
			sourceSet sourceSets.main
		}
	}
}

// ------------------------------------------------------------------------------
// Mod Metadata Expansion & Task Registration
// ------------------------------------------------------------------------------
def NON_MOD_VERSION_PREFIXES = ['java_', 'parchment_', 'mdg_', 'foojay_', 'immaculate_', 'major_fml_'] as Set

ext.registerModMetadata = { Map extraProps = [:] ->
	def replaceProperties = [
		version: project.version,
		group: project.group,
		mod_name: mod_name,
		mod_author: mod_author,
		mod_id: mod_id,
		license: license,
		description: project.description,
		icon: project.findProperty('icon') ?: 'icon.png',
		github_name: project.findProperty('github_name') ?: (project.findProperty('mod_name') ? project.mod_name.toString().replaceAll(/[^A-Za-z0-9 _-]/, '').trim().replaceAll(/\s+/, '-') : null),
		major_fml_version: major_fml_version,
		java_version: java_version,
	]

	project.properties.each { key, val ->
		def k = key.toString()
		if (k.endsWith('_version') && val != null) {
			def strVal = val.toString()
			if (!replaceProperties.containsKey(k)) {
				replaceProperties.put(k, strVal)
			}
			def rangeKey = "${k}_range".toString()
			if (!replaceProperties.containsKey(rangeKey)) {
				switch (k) {
					case 'minecraft_version':
						replaceProperties.put(rangeKey, ext.getPatchVersionRange(strVal))
						break
					case 'neoforge_version':
						replaceProperties.put(rangeKey, ext.getMinorVersionRange(strVal))
						break
					case 'mineraculous_version':
						replaceProperties.put(rangeKey, ext.getMineraculousVersionRange(strVal))
						break
					default:
						if (!NON_MOD_VERSION_PREFIXES.any { k.startsWith(it) } && !k.endsWith('_api_version')) {
							replaceProperties.put(rangeKey, ext.getMajorVersionRange(strVal))
						}
						break
				}
			}
		}
	}

	replaceProperties.putAll(extraProps)

	Map<String, Object> stringifiedProperties = [:]
	replaceProperties.each { k, v ->
		stringifiedProperties.put(k.toString(), v != null ? v.toString() : '')
	}

	def generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
		inputs.properties stringifiedProperties
		expand stringifiedProperties
		from "src/main/templates"
		into "build/generated/sources/modMetadata"
	}

	sourceSets.main.resources.srcDir generateModMetadata
	tasks.processResources.dependsOn generateModMetadata
	return generateModMetadata
}

// ------------------------------------------------------------------------------
// Git Hooks Automation (Block pushes to protected release branches)
// ------------------------------------------------------------------------------
def isCI = System.getenv("CI") != null || System.getenv("GITHUB_ACTIONS") != null
def hasGit = layout.projectDirectory.dir('.git').asFile.exists()
def gitDir = layout.projectDirectory.dir('.git').asFile
def projectRootDir = project.projectDir

tasks.register('setupGitHooks') {
	description = 'Automatically installs pre-push hook into .git/hooks to protect release branches'
	group = 'verification'
	enabled = hasGit && !isCI && isInternalProject

	// Capture plain File objects outside doLast closure for Configuration Cache compatibility
	def targetGitDir = gitDir
	def targetWorkDir = projectRootDir

	doLast {
		if (!targetGitDir.exists() || !targetGitDir.isDirectory()) {
			return
		}

		// Ensure core.hooksPath is unset so git uses standard .git/hooks
		try {
			new ProcessBuilder('git', 'config', '--unset', 'core.hooksPath')
				.directory(targetWorkDir)
				.start()
				.waitFor()
		} catch (Exception ignored) {}

		def hooksDir = new File(targetGitDir, 'hooks')
		if (!hooksDir.exists()) {
			hooksDir.mkdirs()
		}

		def hookFile = new File(hooksDir, 'pre-push')
		hookFile.text = '''#!/bin/sh
# Prevent direct pushes to release branches (main and version branches)

while read -r local_ref local_oid remote_ref remote_oid
do
    if [ "$remote_ref" = "refs/heads/main" ] || [ "$remote_ref" = "refs/heads/1.21.1" ]; then
        echo "=========================================================="
        echo " [BLOCKED] Direct push to release branch is forbidden!"
        echo " Please create a feature branch and submit a Pull Request:"
        echo "   git checkout -b feature/your-feature"
        echo "   git push origin feature/your-feature"
        echo "=========================================================="
        exit 1
    fi
done

exit 0
'''
		hookFile.setExecutable(true, false)
	}
}

tasks.named('compileJava') {
	dependsOn 'setupGitHooks'
}

// ------------------------------------------------------------------------------
// Automated package-info.java Generation (NonnullByDefault)
// ------------------------------------------------------------------------------
if (file('src/main/java').exists()) {
	def generatePackageInfos = tasks.register('generatePackageInfos') {
		File srcDir = file('src/main/java')
		File outDir = layout.buildDirectory.dir("generated/sources/packageInfo/main/java").get().asFile
		inputs.dir(srcDir)
		outputs.dir(outDir)
		doLast {
			srcDir.eachFileRecurse { file ->
				if (file.isDirectory()) {
					def javaFiles = file.listFiles({ f -> f.name.endsWith('.java') } as FileFilter)
					if (javaFiles != null && javaFiles.length > 0) {
						String relPath = srcDir.toPath().relativize(file.toPath()).toString().replace('\\', '/')
						String pkgName = relPath.replace('/', '.')
						File pkgInfo = new File(outDir, relPath + '/package-info.java')
						pkgInfo.parentFile.mkdirs()
						pkgInfo.text = """@ParametersAreNonnullByDefault
@MethodsReturnNonnullByDefault
package ${pkgName};

import javax.annotation.ParametersAreNonnullByDefault;
import net.minecraft.MethodsReturnNonnullByDefault;
"""
					}
				}
			}
		}
	}

	sourceSets.main.java.srcDir generatePackageInfos
}

// ------------------------------------------------------------------------------
// Code Formatting (Immaculate & Spotless)
// ------------------------------------------------------------------------------
plugins.withId('dev.lukebemish.immaculate') {
	compileJava.dependsOn immaculateApply
	compileJava.finalizedBy immaculateCheck
	tasks.named('check').configure {
		dependsOn immaculateCheck
	}

	immaculate {
		workflows.register('java') {
			files.from rootProject.fileTree("src", {
				include "**/*.java"
			})
			noTabs()
			google {
				fixImports()
			}
			toggleOff = 'spotless:off'
			toggleOn = 'spotless:on'

			def configFile = rootProject.file('codeformat/formatter-config.xml')
			if (!configFile.exists()) {
				configFile = rootProject.layout.buildDirectory.file('codeformat/formatter-config.xml').get().asFile
				if (!configFile.exists()) {
					configFile.parentFile.mkdirs()
					try {
						new URL('https://raw.githubusercontent.com/Mineraculous/.github/main/codeformat/formatter-config.xml').withInputStream { i ->
							configFile.withOutputStream { it << i }
						}
					} catch (Exception e) {
						logger.warn("Failed to download formatter config: ${e.message}")
					}
				}
			}
			if (configFile.exists()) {
				eclipse {
					version '3.37.0'
					config = configFile
				}
			}

			custom 'canonicalizeNullable', { String fileContents ->
				fileContents = fileContents.replace('javax.annotation.Nullable', 'org.jetbrains.annotations.Nullable')
				fileContents = fileContents.replace('jakarta.annotation.Nullable', 'org.jetbrains.annotations.Nullable')
				fileContents = fileContents.replace('edu.umd.cs.findbugs.annotations.Nullable', 'org.jetbrains.annotations.Nullable')
				fileContents = fileContents.replace('org.checkerframework.checker.nullness.qual.Nullable', 'org.jetbrains.annotations.Nullable')
				fileContents = fileContents.replace('android.annotation.Nullable', 'org.jetbrains.annotations.Nullable')
				fileContents = fileContents.replace('com.google.errorprone.annotations.Nullable', 'org.jetbrains.annotations.Nullable')
				return fileContents
			}

			custom 'noWildcardImports', { String fileContents ->
				if (Pattern.compile('(?m)^\\s*import\\s+(?:static\\s+)?[^;\\r\\n]+\\*;').matcher(fileContents).find()) {
					throw new GradleException('No wildcard imports are allowed! Explicitly import each class.')
				}
			}

			custom 'noStaticImports', { String fileContents ->
				if (Pattern.compile('(?m)^\\s*import\\s+static\\s+').matcher(fileContents).find()) {
					throw new GradleException('Static imports are disallowed. Use class qualification (e.g. Collections.emptyList()).')
				}
			}

			custom 'noNotNull', { String fileContents ->
				if (fileContents.contains('@NotNull') || fileContents.contains('@Nonnull')) {
					throw new GradleException('@NotNull and @Nonnull are disallowed. Parameters and return types are non-null by default via package-info.java.')
				}
			}

			custom 'noVar', { String fileContents ->
				if (Pattern.compile('(?m)^\\s*(?:final\\s+)?var\\s+[a-zA-Z_$][a-zA-Z0-9_$]*\\s*=').matcher(fileContents).find()) {
					throw new GradleException("Do not use the 'var' keyword. Explicitly define variable types.")
				}
			}

			custom 'singleLineParameters', { String fileContents ->
				Pattern recordPattern = Pattern.compile('(?s)(\\brecord\\s+[A-Za-z0-9_$]+(?:<[^>{}]+>)?\\s*\\()((?:[^()]|\\([^()]*\\))*?)(\\)\\s*(?:implements\\s+[^{]+)?\\{)')
				fileContents = recordPattern.matcher(fileContents).replaceAll { Matcher m ->
					String params = m.group(2).replaceAll('\\s*\\r?\\n\\s*', ' ').trim()
					return Matcher.quoteReplacement(m.group(1) + params + m.group(3))
				}

				Pattern methodPattern = Pattern.compile('(?s)(^[ \\t]*(?:(?:/\\*\\*(?:[^*]|\\*(?!/))*\\*/|(?:///[^\\r\\n]*\\r?\\n[ \\t]*)+)\\r?\\n[ \\t]*)?(?:@[A-Za-z0-9_.]+(?:\\((?:[^()]|\\([^()]*\\))*\\))?[ \\t]*(?:\\r?\\n[ \\t]*)?)*(?:(?:public|protected|private|static|final|abstract|synchronized|native|default)\\s+)+(?!class\\b|interface\\b|enum\\b|record\\b|@interface\\b)(?:<[^>{}]+>\\s+)?(?:(?:@[A-Za-z0-9_.]+(?:\\((?:[^()]|\\([^()]*\\))*\\))?\\s+)|[A-Za-z0-9_.<>\\[\\], \\t]+?\\s+)*(?:[A-Za-z0-9_$]+\\s*\\())((?:[^()]|\\([^()]*\\))*?)(\\)\\s*(?:throws\\s+[^{;]+)?(?:\\{|;))', Pattern.MULTILINE)
				fileContents = methodPattern.matcher(fileContents).replaceAll { Matcher m ->
					String params = m.group(2).replaceAll('\\s*\\r?\\n\\s*', ' ').trim()
					return Matcher.quoteReplacement(m.group(1) + params + m.group(3))
				}

				return fileContents
			}

			custom 'noBlankLinesAfterClassDeclarations', { String fileContents ->
				Pattern pattern = Pattern.compile('(?s)(\\b(?:class|interface|enum|record|@interface)\\b[^{;]*?\\{(?:[ \\t]*//[^\\r\\n]*)?)[ \\t]*\\r?\\n(?:[ \\t]*\\r?\\n)+')
				return pattern.matcher(fileContents).replaceAll('$1\n')
			}

			custom 'blankLinesBeforeMethods', { String fileContents ->
				Pattern pattern = Pattern.compile('(?m)^([ \\t]*(?:[^\\r\\n;]+;|\\})(?:[ \\t]*//[^\\r\\n]*)?)\\r?\\n([ \\t]*(?:(?:/\\*\\*(?:[^*]|\\*(?!/))*\\*/|(?:///[^\\r\\n]*\\r?\\n[ \\t]*)+)\\r?\\n[ \\t]*)?(?:@[A-Za-z0-9_.]+(?:\\((?:[^()]|\\([^()]*\\))*\\))?[ \\t]*(?:\\r?\\n[ \\t]*)?)*(?:(?:public|protected|private|static|final|abstract|synchronized|native|default)\\s+)+(?!class\\b|interface\\b|enum\\b|record\\b|@interface\\b)(?:<[^>{}]+>\\s+)?(?:(?:@[A-Za-z0-9_.]+(?:\\((?:[^()]|\\([^()]*\\))*\\))?\\s+)|[A-Za-z0-9_.<>\\[\\], \\t]+?\\s+)*(?:[A-Za-z0-9_]+\\s*\\(|[A-Za-z0-9_]+\\s*\\{))')
				return pattern.matcher(fileContents).replaceAll('$1\n\n$2')
			}

			custom 'blankLinesBeforeMemberTypes', { String fileContents ->
				Pattern pattern = Pattern.compile('(?m)^([ \\t]*(?:[^\\r\\n;]+;|\\})(?:[ \\t]*//[^\\r\\n]*)?)\\r?\\n([ ]{4}(?:(?:/\\*\\*(?:[^*]|\\*(?!/))*\\*/|(?:///[^\\r\\n]*\\r?\\n[ \\t]*)+)\\r?\\n[ ]{4})?(?:@[A-Za-z0-9_.]+(?:\\((?:[^()]|\\([^()]*\\))*\\))?\\s+)*(?:(?:public|protected|private|static|final|abstract|sealed|non-sealed)\\s+)*(?:class|interface|enum|record|@interface)\\s+[A-Za-z0-9_]+|[ ]{8,}(?:(?:/\\*\\*(?:[^*]|\\*(?!/))*\\*/|(?:///[^\\r\\n]*\\r?\\n[ \\t]*)+)\\r?\\n[ ]{8,})?(?:@[A-Za-z0-9_.]+(?:\\((?:[^()]|\\([^()]*\\))*\\))?\\s+)*(?:(?:public|protected|private|static|final|abstract|sealed|non-sealed)\\s+)*(?:public|protected|private)\\s+(?:(?:public|protected|private|static|final|abstract|sealed|non-sealed)\\s+)*(?:class|interface|enum|record|@interface)\\s+[A-Za-z0-9_]+)')
				return pattern.matcher(fileContents).replaceAll('$1\n\n$2')
			}

			custom 'trimTrailingWhitespace', { String fileContents ->
				return fileContents.replaceAll('(?m)[ \t]+$', '')
			}

			custom 'endWithNewline', { String fileContents ->
				return fileContents.stripTrailing() + '\n'
			}
		}

		workflows.register('gradle') {
			files.from rootProject.fileTree(projectDir, {
				include '**/*.gradle'
				include '**/*.gradle.kts'
				exclude 'build/**', '.gradle/**', 'src/generated/**'
			})
			custom 'trimTrailingWhitespace', { String fileContents ->
				return fileContents.replaceAll('(?m)[ \t]+$', '')
			}
			custom 'endWithNewline', { String fileContents ->
				return fileContents.stripTrailing() + '\n'
			}
		}

		workflows.register('json') {
			files.from rootProject.fileTree("src/main/resources", {
				include "**/*.json"
			})
			custom 'trimTrailingWhitespace', { String fileContents ->
				return fileContents.replaceAll('(?m)[ \t]+$', '')
			}
			custom 'endWithNewline', { String fileContents ->
				return fileContents.stripTrailing() + '\n'
			}
		}
	}
}

// ------------------------------------------------------------------------------
// Javadoc & IDE Configuration
// ------------------------------------------------------------------------------
javadoc {
	failOnError = false
	options {
		tags = [
				'apiNote:a:API Note:'
		]
	}
}

idea {
	module {
		downloadSources = true
		downloadJavadoc = true
	}
}

// ------------------------------------------------------------------------------
// Manifest & Outgoing Capabilities
// ------------------------------------------------------------------------------
jar {
	manifest {
		attributes([
				'Specification-Title'   : mod_name,
				'Specification-Vendor'  : mod_author,
				'Specification-Version' : project.jar.archiveVersion,
				'Implementation-Title'  : project.name,
				'Implementation-Version': project.jar.archiveVersion,
				'Implementation-Vendor' : mod_author,
				'Built-On-Minecraft'    : minecraft_version
		])
	}
}

def isBetaBuild = project.version.toString().contains("beta")

tasks.withType(GenerateModuleMetadata).configureEach {
	enabled = !isBetaBuild
}

if (!isBetaBuild) {
	['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
		configurations."$variant".outgoing {
			capability("$group:${base.archivesName.get()}:$version")
			capability("$group:$mod_id-${project.name}-${minecraft_version}:$version")
			capability("$group:$mod_id:$version")
		}
		publishing.publications.configureEach {
			suppressPomMetadataWarningsFor(variant)
		}
	}
}

signing {
	useGpgCmd()
	required { project.hasProperty('signing.keyId') || project.hasProperty('signing.gnupg.keyName') || System.getenv('GPG_SIGNING_KEY') != null }
	sign publishing.publications.matching { it.name == 'mavenJava' }
}

// ------------------------------------------------------------------------------
// Beta Tester Management & Artifact Publishing
// ------------------------------------------------------------------------------
def shouldGenerateBetaTesterJars = isBetaBuild && isInternalProject

def getBetaTesters() {
	def testers = []
	try {
		def gistUrl = new URL('https://gist.githubusercontent.com/thomasglasser/aa8eb933847685b93d8f99a59f07b62e/raw/mineraculous_special_players.txt')
		gistUrl.eachLine { line ->
			if (!line.startsWith("//") && line.contains("beta")) {
				def parts = line.split("\\|")
				if (parts.length > 0) {
					testers.add(parts[0].trim())
				}
			}
		}
	} catch (Exception e) {
		println "WARNING: Failed to fetch beta testers from Gist: ${e.message}"
	}
	return testers
}

def getBetaTesterUuid(String name) {
	try {
		def gistUrl = new URL('https://gist.githubusercontent.com/thomasglasser/aa8eb933847685b93d8f99a59f07b62e/raw/mineraculous_special_players.txt')
		for (String line : gistUrl.readLines()) {
			if (!line.startsWith("//") && line.contains("beta")) {
				def parts = line.split("\\|")
				if (parts.length > 1 && parts[0].trim().equals(name)) {
					return parts[1].trim()
				}
			}
		}
	} catch (Exception e) {
		println "WARNING: Failed to fetch beta tester UUID for ${name}: ${e.message}"
	}
	return ""
}

def registerBetaJar(String testerName) {
	String testerUuid = getBetaTesterUuid(testerName)
	if (!tasks.names.contains("jarBeta${testerName}")) {
		File generatedMetaDir = layout.buildDirectory.dir("generated/beta/${testerName}/META-INF").get().asFile
		File betaDir = layout.buildDirectory.dir("generated/beta/${testerName}").get().asFile
		String modVersion = project.version.toString()
		String modGroup = "${project.group}.${testerName}".toString()

		tasks.register("jarBeta${testerName}", Jar) { jarTask ->
			jarTask.destinationDirectory = layout.buildDirectory.dir("libs/beta/${testerName}")
			jarTask.archiveBaseName = base.archivesName.get()
			jarTask.archiveVersion = project.jar.archiveVersion
			jarTask.from sourceSets.main.output

			jarTask.doFirst {
				File propFile = new File(generatedMetaDir, "mineraculous_beta.properties")
				propFile.parentFile.mkdirs()
				propFile.text = "tester=${testerName}\nuuid=${testerUuid}\nversion=${modVersion}\ngroup=${modGroup}\n"
			}
			jarTask.from(betaDir)

			jarTask.manifest {
				attributes([
						'Specification-Title'   : mod_name,
						'Specification-Vendor'  : mod_author,
						'Specification-Version' : project.jar.archiveVersion,
						'Implementation-Title'  : project.name,
						'Implementation-Version': project.jar.archiveVersion,
						'Implementation-Vendor' : mod_author,
						'Built-On-Minecraft'    : minecraft_version,
						'Beta-Tester'           : testerName,
						'Beta-Tester-UUID'      : testerUuid
				])
			}
		}
	}
}

ext.getBetaTesters = this.&getBetaTesters
ext.getBetaTesterUuid = this.&getBetaTesterUuid
ext.registerBetaJar = this.&registerBetaJar

// ------------------------------------------------------------------------------
// Standard Maven Publishing
// ------------------------------------------------------------------------------
publishing {
	def githubOwner = project.findProperty('github_owner') ?: 'thomasglasser'
	def repoName = project.findProperty('github_name') ?: (project.findProperty('mod_name') ? project.mod_name.toString().replaceAll(/[^A-Za-z0-9 _-]/, '').trim().replaceAll(/\s+/, '-') : null)
	if (!repoName) {
		throw new GradleException("Neither 'github_name' nor 'mod_name' was provided for publishing metadata SCM/issue tracking.")
	}

	publications {
		if (shouldGenerateBetaTesterJars) {
			getBetaTesters().each { testerName ->
				registerBetaJar(testerName)

				register("mavenBeta${testerName}", MavenPublication) {
					groupId = "${project.group}.${testerName}"
					artifactId = base.archivesName.get()
					version = "${project.version}"
					from components.java

					artifacts.removeIf { it.classifier == null && (it.extension == 'jar' || (it.file != null && it.file.name.endsWith('.jar'))) }
					artifact(tasks.named("jarBeta${testerName}"))

					pom {
						name = project.mod_name
						description = project.description
						url = "https://github.com/${githubOwner}/${repoName}/wiki"
						licenses {
							license {
								name = project.license
							}
						}
						developers {
							developer {
								id = project.mod_author
								name = project.mod_author
							}
						}
						issueManagement {
							system = 'GitHub'
							url = "https://github.com/${githubOwner}/${repoName}/issues"
						}
						scm {
							connection = "scm:git:git://github.com/${githubOwner}/${repoName}.git"
							developerConnection = "scm:git:ssh://github.com:${githubOwner}/${repoName}.git"
							url = "https://github.com/${githubOwner}/${repoName}/tree/${minecraft_version}"
						}
					}
				}
			}
		} else {
			register('mavenJava', MavenPublication) {
				artifactId = base.archivesName.get()
				from components.java

				pom {
					name = project.mod_name
					description = project.description
					url = "https://github.com/${githubOwner}/${repoName}/wiki"
					licenses {
						license {
							name = project.license
						}
					}
					developers {
						developer {
							id = project.mod_author
							name = project.mod_author
						}
					}
					issueManagement {
						system = 'GitHub'
						url = "https://github.com/${githubOwner}/${repoName}/issues"
					}
					scm {
						connection = "scm:git:git://github.com/${githubOwner}/${repoName}.git"
						developerConnection = "scm:git:ssh://github.com:${githubOwner}/${repoName}.git"
						url = "https://github.com/${githubOwner}/${repoName}/tree/${minecraft_version}"
					}
				}
			}
		}
	}

	repositories {
		def customMavenUrl = project.findProperty('maven_url') ?: project.findProperty('publish_maven_url')
		if (customMavenUrl) {
			maven {
				name = "Publish Maven"
				url = customMavenUrl
				credentials {
					username = project.findProperty("MAVEN_USERNAME") ?: System.getenv("MAVEN_USERNAME") ?: project.findProperty("REPOSILITE_USERNAME") ?: System.getenv("REPOSILITE_USERNAME")
					password = project.findProperty("MAVEN_PASSWORD") ?: System.getenv("MAVEN_PASSWORD") ?: project.findProperty("REPOSILITE_PASSWORD") ?: System.getenv("REPOSILITE_PASSWORD")
				}
			}
		} else if (isInternalProject) {
			maven {
				name = "Reposilite"
				url = isBetaBuild ? "https://maven.thomasglasser.dev/betas" : "https://maven.thomasglasser.dev/releases"
				credentials {
					username = project.findProperty("REPOSILITE_USERNAME") ?: System.getenv("REPOSILITE_USERNAME")
					password = project.findProperty("REPOSILITE_PASSWORD") ?: System.getenv("REPOSILITE_PASSWORD")
				}
			}
		}
	}
}

// ------------------------------------------------------------------------------
// HTTP Connection Stabilization & Publishing Pre-Flight Checks
// ------------------------------------------------------------------------------
System.setProperty("http.keepAlive", "false")
System.setProperty("org.gradle.internal.http.connectionTimeout", "120000")
System.setProperty("org.gradle.internal.http.socketTimeout", "120000")

// Automatically enable --continue for publish tasks so network hiccups on weak connections
// don't abort the whole run.
if (gradle.startParameter.taskNames.any { it.toLowerCase().contains('publish') }) {
	gradle.startParameter.continueOnFailure = true
}

// Ensure artifact uploads happen sequentially (one at a time) rather than saturating weak Wi-Fi
// with multiple simultaneous large file uploads.
abstract class PublishMutex implements BuildService<BuildServiceParameters.None> {}
def publishMutex = gradle.sharedServices.registerIfAbsent("publishMutex", PublishMutex) {
	maxParallelUsages = 1
}

tasks.withType(PublishToMavenRepository).configureEach { task ->
	usesService(publishMutex)
	onlyIf {
		if (project.hasProperty('forcePublish') && project.property('forcePublish') == 'true') {
			return true
		}
		if (!(task.repository instanceof MavenArtifactRepository)) {
			return true
		}
		def repo = (MavenArtifactRepository) task.repository
		if (repo.url.scheme != 'http' && repo.url.scheme != 'https') {
			return true
		}
		def pub = task.publication
		if (!(pub instanceof MavenPublication)) {
			return true
		}

		def groupPath = pub.groupId.replace('.', '/')
		def artifactName = "${pub.artifactId}-${pub.version}.jar"
		def artifactUrl = "${repo.url.toString().replaceAll('/+$', '')}/${groupPath}/${pub.artifactId}/${pub.version}/${artifactName}"

		try {
			def conn = (HttpURLConnection) new URI(artifactUrl).toURL().openConnection()
			conn.requestMethod = 'HEAD'
			conn.connectTimeout = 8000
			conn.readTimeout = 8000
			conn.instanceFollowRedirects = true

			def user = repo.credentials.username
			def pass = repo.credentials.password
			if (user && pass) {
				def auth = "${user}:${pass}".bytes.encodeBase64().toString()
				conn.setRequestProperty('Authorization', "Basic ${auth}")
			}

			int code = conn.responseCode
			conn.disconnect()

			if (code == 200) {
				logger.lifecycle("Artifact ${pub.groupId}:${pub.artifactId}:${pub.version} already exists in ${repo.name}. Skipping ${task.name}.")
				return false
			}
		} catch (Exception e) {
			logger.warn("Could not check if artifact exists for ${task.name}: ${e.message}")
		}
		return true
	}
}
