name: Sync Common Configuration Files

on:
  push:
    branches:
      - main
    paths:
      - 'templates/**'
      - '.github/workflows/sync-common-files.yml'
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC
  workflow_dispatch:

jobs:
  sync-files:
    name: Sync to ${{ matrix.target.repo }} (${{ matrix.target.branch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - repo: 'Mineraculous/Mineraculous'
            branch: 'main'
          - repo: 'Mineraculous/Addon-MDK'
            branch: '1.21.1'
          - repo: 'Mineraculous/Mineraculous-Expansion-Kamikotizations'
            branch: 'main'
    steps:
      - name: Validate SYNC_TOKEN Secret
        run: |
          if [ -z "${{ secrets.SYNC_TOKEN }}" ]; then
            echo "::error::The 'SYNC_TOKEN' secret is missing or empty in this repository or organization. A Personal Access Token (classic PAT with 'repo' scope, or fine-grained PAT with 'Contents' and 'Pull requests' read/write access across target repositories) is required to checkout private repositories and create pull requests across the organization."
            exit 1
          fi

      - name: Checkout Source (.github)
        uses: actions/checkout@v7
        with:
          path: source

      - name: Checkout Target (${{ matrix.target.repo }})
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.target.repo }}
          token: ${{ secrets.SYNC_TOKEN }}
          path: target
          ref: ${{ matrix.target.branch }}
          fetch-depth: 0

      - name: Copy Canonical Templates
        run: |
          cp -r source/templates/. target/

      - name: Check for Changes and Open Pull Request
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          cd target
          
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes detected in ${{ matrix.target.repo }}. Target is already up to date."
            exit 0
          fi

          echo "Changes detected! Preparing sync branch..."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          SYNC_BRANCH="sync/common-files"
          git checkout -B "$SYNC_BRANCH"
          git add -A
          git commit -m "chore(sync): synchronize common configurations from .github"
          git push -u origin "$SYNC_BRANCH" --force

          PR_TITLE="chore(sync): synchronize common configurations from .github"
          PR_BODY="This automated PR synchronizes common templates and configurations with the canonical source of truth in [.github](https://github.com/Mineraculous/.github)."

          EXISTING_PR=$(gh pr list --head "$SYNC_BRANCH" --base "${{ matrix.target.branch }}" --state open --json number -q '.[0].number' || true)

          if [ -n "$EXISTING_PR" ]; then
            echo "Updating existing PR #$EXISTING_PR..."
            gh pr edit "$EXISTING_PR" --title "$PR_TITLE" --body "$PR_BODY"
          else
            echo "Creating new PR..."
            gh pr create --repo "${{ matrix.target.repo }}" --title "$PR_TITLE" --body "$PR_BODY" --base "${{ matrix.target.branch }}" --head "$SYNC_BRANCH"
          fi
