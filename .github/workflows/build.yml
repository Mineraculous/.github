name: build

on:
  workflow_call:
    inputs:
      artifact-name:
        description: "Name of the artifact to upload"
        required: false
        type: string
        default: "Mineraculous"
      upload-artifact:
        description: "Whether to upload the build jar artifacts"
        required: false
        type: boolean
        default: true
      run-datagen:
        description: "Whether to run data generation and verify output"
        required: false
        type: boolean
        default: true
    secrets:
      MINERACULOUS_USERNAME:
        required: false
      MINERACULOUS_PASSWORD:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine Java Version
        id: java-version
        run: |
          JAVA_VER=$(grep -E '^\s*java_version\s*=' gradle.properties 2>/dev/null | cut -d'=' -f2 | tr -d ' ' || true)
          if [ -z "$JAVA_VER" ]; then
            echo "::error::java_version must be defined in gradle.properties"
            exit 1
          fi
          echo "version=$JAVA_VER" >> $GITHUB_OUTPUT

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          java-version: ${{ steps.java-version.outputs.version }}
          distribution: 'microsoft'

      - name: Build with Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run Data Generation
        if: ${{ inputs.run-datagen }}
        run: ./gradlew runData
        env:
          MINERACULOUS_USERNAME: ${{ secrets.MINERACULOUS_USERNAME }}
          MINERACULOUS_PASSWORD: ${{ secrets.MINERACULOUS_PASSWORD }}

      - name: Verify Generated Resources are Up-to-Date
        if: ${{ inputs.run-datagen }}
        run: |
          if [ -d "src/generated" ]; then
            if [ -n "$(git status --porcelain src/generated)" ]; then
              echo "::error::Data generation produced uncommitted changes or discrepancies! Please run './gradlew runData' locally and commit the updated generated files."
              git diff src/generated
              exit 1
            fi
          fi

      - name: Assemble the project
        run: ./gradlew build
        env:
          MINERACULOUS_USERNAME: ${{ secrets.MINERACULOUS_USERNAME }}
          MINERACULOUS_PASSWORD: ${{ secrets.MINERACULOUS_PASSWORD }}

      - name: Upload Jars
        if: ${{ inputs.upload-artifact }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          if-no-files-found: error
          path: build/libs
