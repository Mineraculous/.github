name: build

on:
  workflow_call:
    inputs:
      artifact-name:
        description: "Name of the artifact to upload"
        required: false
        type: string
        default: "Mineraculous"
      upload-artifact:
        description: "Whether to upload the build jar artifacts"
        required: false
        type: boolean
        default: true
    secrets:
      MINERACULOUS_USERNAME:
        required: false
      MINERACULOUS_PASSWORD:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble the project
        run: ./gradlew build
        env:
          MINERACULOUS_USERNAME: ${{ secrets.MINERACULOUS_USERNAME }}
          MINERACULOUS_PASSWORD: ${{ secrets.MINERACULOUS_PASSWORD }}

      - name: Upload Jars
        if: ${{ inputs.upload-artifact }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          if-no-files-found: error
          path: build/libs
