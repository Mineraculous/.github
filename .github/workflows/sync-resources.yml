name: sync-resources

on:
  workflow_call:
    inputs:
      mod-id:
        description: "Resource directory/mod ID (e.g. mineraculous, mineraculouskamikotizations)"
        required: true
        type: string
      target-repo:
        description: "Target repository to push resources into"
        required: false
        type: string
        default: "Mineraculous/Resources"
      target-branch:
        description: "Target repository branch"
        required: false
        type: string
        default: "main"
      run-datagen:
        description: "Whether to run data generation before syncing resources"
        required: false
        type: boolean
        default: true
    secrets:
      SYNC_TOKEN:
        required: true
      MINERACULOUS_USERNAME:
        required: false
      MINERACULOUS_PASSWORD:
        required: false

jobs:
  sync-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v7
        with:
          path: source-repo

      - name: Checkout Target Repository
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.target-repo }}
          token: ${{ secrets.SYNC_TOKEN }}
          path: target-repo
          ref: ${{ inputs.target-branch }}

      - name: Determine Java Version
        if: ${{ inputs.run-datagen }}
        id: java-version
        run: |
          JAVA_VER=$(grep -E '^\s*java_version\s*=' source-repo/gradle.properties 2>/dev/null | cut -d'=' -f2 | tr -d ' ' || true)
          if [ -z "$JAVA_VER" ]; then
            echo "::error::java_version must be defined in gradle.properties"
            exit 1
          fi
          echo "version=$JAVA_VER" >> $GITHUB_OUTPUT

      - name: Setup JDK
        if: ${{ inputs.run-datagen }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ steps.java-version.outputs.version }}
          distribution: 'microsoft'

      - name: Setup Gradle
        if: ${{ inputs.run-datagen }}
        uses: gradle/actions/setup-gradle@v6

      - name: Run Data Generation in Source Repository
        if: ${{ inputs.run-datagen }}
        run: |
          cd source-repo
          chmod +x ./gradlew
          ./gradlew runData
        env:
          MINERACULOUS_USERNAME: ${{ secrets.MINERACULOUS_USERNAME }}
          MINERACULOUS_PASSWORD: ${{ secrets.MINERACULOUS_PASSWORD }}

      - name: Merge and Sync Directories
        run: |
          mkdir -p staging/${{ inputs.mod-id }}
          
          # Copy main resources first
          if [ -d "source-repo/src/main/resources" ]; then
            rsync -a source-repo/src/main/resources/ staging/${{ inputs.mod-id }}/
          fi
          
          # Layer generated resources over top
          if [ -d "source-repo/src/generated/resources" ]; then
            rsync -a source-repo/src/generated/resources/ staging/${{ inputs.mod-id }}/
          fi
          
          # Nuke the old folder in the target repo to prevent deleted files from lingering
          rm -rf target-repo/${{ inputs.mod-id }}
          
          # Move the merged staging folder into the target repo
          mv staging/${{ inputs.mod-id }} target-repo/

      - name: Generate Tag Index
        run: |
          cd target-repo/${{ inputs.mod-id }}/reports
          
          # Only run if the tags directory exists
          if [ -d "tags" ]; then
            find tags -type f -name "*.json" | while read -r file; do
              # Remove 'tags/' prefix
              rel_path=${file#tags/}
              # Remove '.json' suffix
              rel_path=${rel_path%.json}
              # Replace the first slash with a colon (e.g. minecraft/block -> minecraft:block)
              echo "${rel_path/\//:}"
            done | jq -R -s 'split("\n")[:-1]' > tags.json
          fi
          
          cd ../../..

      - name: Commit and Push
        run: |
          cd target-repo
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add ${{ inputs.mod-id }}/
          
          # Check if there are actually any changes before trying to commit
          if git diff --staged --quiet; then
            echo "No changes detected. Skipping commit."
          else
            git commit -m "chore: sync ${{ inputs.mod-id }} resources from source"
            git push
          fi
