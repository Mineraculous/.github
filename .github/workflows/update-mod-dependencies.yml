name: Mod Dependency Updater

on:
  workflow_call:
    inputs:
      config-path:
        description: 'Path to mod dependencies JSON file'
        required: false
        default: '.github/mod_dependencies.json'
        type: string
      base-branch:
        description: 'Target base branch to update dependencies against (defaults to GITHUB_REF_NAME or current branch)'
        required: false
        default: ''
        type: string
    secrets:
      SYNC_TOKEN:
        description: 'Token with repo write and pull request write permissions'
        required: false
      MINERACULOUS_USERNAME:
        required: false
      MINERACULOUS_PASSWORD:
        required: false

jobs:
  update-mod-dependencies:
    name: Check Mod Updates
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout central tooling
        uses: actions/checkout@v7
        with:
          repository: 'Mineraculous/.github'
          path: '.central-tooling'

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run Central Dependency Updater
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          MINERACULOUS_USERNAME: ${{ secrets.MINERACULOUS_USERNAME }}
          MINERACULOUS_PASSWORD: ${{ secrets.MINERACULOUS_PASSWORD }}
        run: |
          EXTRA_ARGS=""
          if [ -n "${{ inputs.base-branch }}" ]; then
            EXTRA_ARGS="--base ${{ inputs.base-branch }}"
          fi
          python .central-tooling/scripts/update_mod_dependencies.py --config "${{ inputs.config-path }}" $EXTRA_ARGS
